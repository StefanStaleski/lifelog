name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations match the Drizzle schema
        run: pnpm db:generate && git diff --exit-code -- supabase/migrations
      - run: pnpm db:start
      - run: pnpm db:test
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleDebug lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
